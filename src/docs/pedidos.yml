openapi: 3.0.0
info:
  title: Puertomarisco Pedidos
  version: 1.0.0
  description: API para recibir pedidos desde la app móvil
paths:
  /api/pedidos/cuentas:
    post:
      summary: Crear una nueva cuenta (pedido)
      tags:
        - Pedidos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mctrstNumero:
                  type: string
                  nullable: true
                arerstCodigo:
                  type: string
                msorstCodigo:
                  type: string
                cliNumero:
                  type: string
                cjavNumero:
                  type: string
                mctrstNumComensales:
                  type: integer
                  nullable: true
                mctrstNota:
                  type: string
                  nullable: true
                mctrstDireccionEntregaPedido:
                  type: string
                  nullable: true
                mctrstTelefonoEntregaPedido:
                  type: string
                  nullable: true
                  description: Telefono de 8 digitos sin espacios
                mctrstInstruccionesEntregaPedido:
                  type: string
                  nullable: true
                mctrstCanalDeContacto:
                  type: integer
                  enum: [0,1,2]
                  nullable: true
                mctrstEsPedidoCallCenter:
                  type: boolean
                  nullable: true
                mctrstNoAplicarDescuentoEnPropina:
                  type: boolean
                  nullable: true
                tdvnCodigo:
                  type: string
                detCuentaRst:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      proCodigo:
                        type: string
                      lstModificadoresRst:
                        type: array
                        items:
                          type: object
                          properties:
                            mdfrstCodigo:
                              type: string
                lstAbonosRst:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      tabCodigo:
                        type: string
                      dcarstMontoAbonoPropio:
                        type: number
                      dcarstMontoAbonoAjeno:
                        type: number
                      dcarstObservaciones:
                        type: string
      responses:
        '201':
          description: Pedido recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  receivedAt:
                    type: string
                    format: date-time
                  data:
                    $ref: '#/components/schemas/Pedido'
        '422':
          description: Error de validación
        '500':
          description: Error interno del servidor
components:
  schemas:
    Modificador:
      type: object
      properties:
        mdfrstCodigo:
          type: string
    Detalle:
      type: object
      properties:
        proCodigo:
          type: string
        lstModificadoresRst:
          type: array
          items:
            $ref: '#/components/schemas/Modificador'
    Abono:
      type: object
      properties:
        tabCodigo:
          type: string
        dcarstMontoAbonoPropio:
          type: number
        dcarstMontoAbonoAjeno:
          type: number
        dcarstObservaciones:
          type: string
    Pedido:
      type: object
      properties:
        mctrstNumero:
          type: string
          nullable: true
        arerstCodigo:
          type: string
        msorstCodigo:
          type: string
        cliNumero:
          type: string
        cjavNumero:
          type: string
        mctrstNumComensales:
          type: integer
          nullable: true
        mctrstNota:
          type: string
          nullable: true
        mctrstDireccionEntregaPedido:
          type: string
          nullable: true
        mctrstTelefonoEntregaPedido:
          type: string
          nullable: true
        mctrstInstruccionesEntregaPedido:
          type: string
          nullable: true
        mctrstCanalDeContacto:
          type: integer
          enum: [0,1,2]
        mctrstEsPedidoCallCenter:
          type: boolean
        mctrstNoAplicarDescuentoEnPropina:
          type: boolean
        tdvnCodigo:
          type: string
        detCuentaRst:
          type: array
          items:
            $ref: '#/components/schemas/Detalle'
        lstAbonosRst:
          type: array
          items:
            $ref: '#/components/schemas/Abono'
